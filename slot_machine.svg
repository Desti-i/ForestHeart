<line x1="113" y1="167" x2="187" y2="167" stroke="#2a2050" stroke-width="1"/>
<text x="150" y="115" text-anchor="middle" font-family="monospace" font-size="20" fill="#444">★</text>
<text x="150" y="188" text-anchor="middle" font-family="monospace" font-size="20" fill="#444">◆</text>

<!-- Барабан 3 -->
<rect x="200" y="88" width="78" height="114" rx="6" fill="#1a1235" stroke="#3a2a6a" stroke-width="1"/>
<rect x="202" y="125" width="74" height="40" rx="4" fill="#0a0818"/>
<text x="239" y="153" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="32" fill="#f0c040">7</text>
<line x1="202" y1="123" x2="276" y2="123" stroke="#2a2050" stroke-width="1"/>
<line x1="202" y1="167" x2="276" y2="167" stroke="#2a2050" stroke-width="1"/>
<text x="239" y="115" text-anchor="middle" font-family="monospace" font-size="20" fill="#444">★</text>
<text x="239" y="188" text-anchor="middle" font-family="monospace" font-size="20" fill="#444">◆</text>

<!-- Линия выигрыша -->
<line x1="15" y1="145" x2="285" y2="145" stroke="#f0c040" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

<!-- Боковые рычаги -->
<rect x="6" y="100" width="12" height="20" rx="3" fill="#3a2a7a"/>
