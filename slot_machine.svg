<polygon points="30,37 34,27 38,37 29,31 39,31" fill="#f0c040" opacity="0.9"/>
<polygon points="262,37 266,27 270,37 261,31 271,31" fill="#f0c040" opacity="0.9"/>

<!-- Огни вверху -->
