<svg xmlns="http://www.w3.org/2000/svg" width="300" height="460" viewBox="0 0 300 460">

<!-- Тело машины -->
<rect x="0" y="0" width="300" height="460" rx="18" fill="#2a1f4a" stroke="#6a4fa0" stroke-width="2"/>

<!-- Верхняя панель -->
<rect x="10" y="10" width="280" height="60" rx="10" fill="#1a1235"/>
<rect x="20" y="18" width="260" height="44" rx="8" fill="#0d0920"/>
