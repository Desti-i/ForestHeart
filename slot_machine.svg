<text x="61" y="188" text-anchor="middle" font-family="monospace" font-size="20" fill="#444">◆</text>

<!-- Барабан 2 -->
<rect x="111" y="88" width="78" height="114" rx="6" fill="#1a1235" stroke="#3a2a6a" stroke-width="1"/>
