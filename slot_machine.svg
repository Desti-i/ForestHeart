<text x="29" y="293" font-family="monospace" font-weight="bold" font-size="13" fill="#f0c040">50 EXP</text>

<rect x="157" y="266" width="128" height="34" rx="8" fill="#1a1235" stroke="#3a2a6a" stroke-width="1"/>
