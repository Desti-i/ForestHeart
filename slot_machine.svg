<rect x="230" y="385" width="30" height="24" rx="4" fill="#1a1235" stroke="#3a2a6a" stroke-width="1"/>

<!-- Таблица выплат -->
<rect x="5" y="415" width="290" height="42" rx="8" fill="#1a1235" stroke="#2a1f4a" stroke-width="1"/>
<text x="15" y="430" font-family="monospace" font-size="11" fill="#f0c040">7 7 7 = x20</text>
<text x="110" y="430" font-family="monospace" font-size="11" fill="#aaa">★★★ = x10</text>
<text x="210" y="430" font-family="monospace" font-size="11" fill="#888">☠☠☠ = x8</text>
<text x="15" y="449" font-family="monospace" font-size="11" fill="#888">◆◆◆ = x5</text>
<text x="110" y="449" font-family="monospace" font-size="11" fill="#666">Два = x1</text>
<text x="210" y="449" font-family="monospace" font-size="11" fill="#555">Нет = -ст.</text>

</svg>
